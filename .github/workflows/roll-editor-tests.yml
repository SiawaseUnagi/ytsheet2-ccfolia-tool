name: Test roll editor

on:
  push:
    branches: ["main", "feature/roll-editor-cleanup"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Existing calculation regressions and typecheck
        run: node tests/calculation.test.cjs
      - name: Existing flag naming regressions
        run: node tests/flagNames.test.cjs
      - name: Existing editor validation regressions
        run: node tests/editorValidation.test.cjs
      - name: Saved sessions and update merging
        run: node tests/session-core.test.cjs
      - name: Effect rolls and grouped check editor
        run: node tests/roll-editor.test.cjs
      - run: npm run build
