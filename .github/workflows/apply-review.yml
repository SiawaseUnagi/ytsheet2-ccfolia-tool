name: Apply maintenance review fixes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/apply-review-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Reassemble and verify reviewed patch
        run: |
          cat .github/apply/part-* > /tmp/review.patch.b64
          test "$(wc -c < /tmp/review.patch.b64)" -eq 135176
          test "$(sha256sum /tmp/review.patch.b64 | cut -d' ' -f1)" = "4d011110156fefca31a9b795364cf023b033a19a579793abdc553029992e3d5c"
          base64 -d /tmp/review.patch.b64 > /tmp/review.patch.gz
          test "$(sha256sum /tmp/review.patch.gz | cut -d' ' -f1)" = "694c6c51eafb046de4c117d35f532790c16f1d1872cf7cfb37b39d395ca735be"
          gzip -t /tmp/review.patch.gz
          gzip -dc /tmp/review.patch.gz > /tmp/review.patch
          test "$(sha256sum /tmp/review.patch | cut -d' ' -f1)" = "54317b9f37d10b22370530b3da5a35b050193ec18a27941ddb098f594811f800"
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          sha256sum -c .github/apply/final-manifest.sha256
          # The GitHub Actions token cannot modify workflow files. Keep the branch's
          # current workflow directory for this push; workflow cleanup/replacement is
          # applied afterwards through the authenticated GitHub connector.
          git checkout HEAD -- .github/workflows
          rm -rf .github/apply
      - name: Verify
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npm run test:browser
          npm audit --audit-level=high
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Fix saved-update flows and refactor generation"
          git push origin HEAD:maintenance/apply-review-fixes
