name: Apply maintenance review fixes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/apply-review-fixes
          fetch-depth: 0
      - name: Apply verified intact prefix
        run: |
          cat .github/apply/part-* > /tmp/review.patch.b64
          base64 -d /tmp/review.patch.b64 > /tmp/review.patch.gz
          gzip -dc /tmp/review.patch.gz > /tmp/review.patch || true
          head -n 6161 /tmp/review.patch > /tmp/prefix.patch
          git apply --check /tmp/prefix.patch
          git apply /tmp/prefix.patch
          rm -rf .github/apply .github/workflows/apply-review.yml
      - name: Commit prefix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage verified maintenance refactor"
          git push origin HEAD:maintenance/apply-review-fixes
