name: Apply maintenance review fixes
on:
  push:
    branches: [maintenance/apply-review-fixes]
    paths:
      - ".github/apply/READY"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Reassemble and apply reviewed patch
        run: |
          cat .github/apply/part-* > /tmp/review.patch.b64
          base64 -d /tmp/review.patch.b64 > /tmp/review.patch.gz
          gzip -dc /tmp/review.patch.gz > /tmp/review.patch
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          rm -rf .github/apply .github/workflows/apply-review.yml
      - name: Verify
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npm run test:browser
          npm audit --audit-level=high
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Fix saved-update flows and refactor generation"
          git push origin HEAD:maintenance/apply-review-fixes
