name: Apply maintenance review fixes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/apply-review-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Reassemble and verify reviewed patch
        run: |
          cat .github/apply/part-* > /tmp/review.patch.b64
          echo "base64 bytes: $(wc -c < /tmp/review.patch.b64)"
          echo "base64 sha256: $(sha256sum /tmp/review.patch.b64 | cut -d' ' -f1)"
          if [ "$(wc -c < /tmp/review.patch.b64)" -ne 135176 ] || [ "$(sha256sum /tmp/review.patch.b64 | cut -d' ' -f1)" != "7acdf03629af8309065958cb8505489d3b536787da8f312d5e84f284507fa6a6" ]; then
            echo "staged part hashes:"
            sha256sum .github/apply/part-*
            exit 1
          fi
          base64 -d /tmp/review.patch.b64 > /tmp/review.patch.gz
          echo "gzip sha256: $(sha256sum /tmp/review.patch.gz | cut -d' ' -f1)"
          test "$(sha256sum /tmp/review.patch.gz | cut -d' ' -f1)" = "694c6c51eafb046de4c117d35f532790c16f1d1872cf7cfb37b39d395ca735be"
          gzip -t /tmp/review.patch.gz
          gzip -dc /tmp/review.patch.gz > /tmp/review.patch
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          rm -rf .github/apply .github/workflows/apply-review.yml
      - name: Verify
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npm run test:browser
          npm audit --audit-level=high
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Fix saved-update flows and refactor generation"
          git push origin HEAD:maintenance/apply-review-fixes
