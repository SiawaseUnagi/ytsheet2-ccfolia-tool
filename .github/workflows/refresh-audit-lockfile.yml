name: Refresh audited npm lockfile
on:
  push:
    branches:
      - feat/scenario-reset-and-optional-checks-20261103
    paths:
      - .github/workflows/refresh-audit-lockfile.yml
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/feat/scenario-reset-and-optional-checks-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Update only audited vulnerable packages
        run: |
          npm install --save-dev --save-exact vite@7.3.7 --ignore-scripts --no-audit
          npm update source-map-js --ignore-scripts --no-audit
          npm audit --audit-level=high
      - name: Commit verified lockfile changes to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Vite and source-map-js to audited versions"
            git push origin HEAD:refs/heads/feat/scenario-reset-and-optional-checks-20261103
          fi
